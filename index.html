    .mp-bigplay{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(13,15,26,.62);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px);transition:transform .2s,background .2s}
    .mp-bigplay:hover{background:var(--purple);transform:translate(-50%,-50%) scale(1.06)}.mp-bigplay svg{width:30px;height:30px;transform:translateX(-2px)}
    .mp-status{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center;padding:20px;color:#d7d9eb;font-size:13px;background:rgba(5,6,12,.88);line-height:1.8}
    .mp-status.error{color:#ffd3cc}.mp-status strong{font-size:14px;display:block}.mp-status .mp-sub{font-size:11px;color:var(--muted);max-width:420px}
    .mp-hint{position:absolute;z-index:3;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;padding:8px 14px;border-radius:999px;background:rgba(10,12,24,.82);border:1px solid rgba(255,255,255,.18);pointer-events:none;white-space:nowrap}
    .mp-controls{position:relative;padding:10px 12px 12px;background:#0d101c;border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px}
    .mp-seekrow{display:flex;align-items:center;gap:10px;font-size:11px;color:#c5c7dc;font-variant-numeric:tabular-nums}
    .mp-seekrow span{min-width:38px;text-align:center}
    .mp-range{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;cursor:pointer;--pct:0%;margin:0}
    .mp-range::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to right,var(--cyan) var(--pct),rgba(255,255,255,.16) var(--pct))}
    .mp-range::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.16)}.mp-range::-moz-range-progress{height:5px;border-radius:5px;background:var(--cyan)}
    .mp-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 0 4px rgba(98,228,212,.18)}
    .mp-range::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
    .mp-btnrow{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}.mp-spacer{flex:1}
    .mp-btn,.mp-chip{border:1px solid transparent;background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;transition:background .2s,border .2s}
    .mp-btn:hover,.mp-chip:hover{background:rgba(255,255,255,.11)}.mp-btn svg,.mp-chip svg{width:19px;height:19px;flex:none}.mp-btn small{font-size:9px;font-weight:800;margin-inline-start:-2px}
    .mp-chip{font-size:12px;font-weight:700;border-color:var(--line)}.mp-chip.on{color:#10121d;background:linear-gradient(135deg,#83f1df,#76d9cf);border-color:transparent}.mp-chip.dim{opacity:.55}
    .mp-vol{display:flex;align-items:center;gap:2px}.mp-vol .mp-range{width:84px;flex:none}
    .mp-menu{position:absolute;z-index:10;bottom:calc(100% - 4px);left:12px;min-width:230px;max-width:calc(100% - 24px);max-height:min(300px,46dvh);overflow:auto;padding:8px;border-radius:16px;background:#171b2f;border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.55)}
    .mp-menu-title{font-size:11px;color:var(--muted);padding:6px 10px 8px}.mp-menu-note{font-size:12px;color:var(--muted);padding:10px;line-height:1.7}
    .mp-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:none;color:var(--text);padding:10px;border-radius:11px;font-size:13px;text-align:right}
    .mp-item:hover{background:rgba(255,255,255,.07)}.mp-item.active{color:var(--cyan);background:rgba(98,228,212,.07)}.mp-item em{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:2px}.mp-item svg{width:16px;height:16px;flex:none}
    .mp.is-fs{background:#000;width:100%;height:100%}.mp.is-fs .mp-stage{flex:1;min-height:0;max-height:none;aspect-ratio:auto;border-radius:0}.mp.is-fs .mp-controls{border-radius:0;border:0}
    .mp.pseudo-fs{position:fixed;inset:0;z-index:200;height:100dvh}
    .mp:fullscreen{background:#000}.mp:-webkit-full-screen{background:#000}
    .mp-stage .hidden{display:none!important}
    @media(max-width:560px){.player-body{padding:10px 10px 14px}.mp-stage{border-radius:13px 13px 0 0}.mp-controls{padding:8px}.mp-vol .mp-range{display:none}.mp-btn,.mp-chip{height:38px;padding:0 8px}.mp-chip span{font-size:11px}.mp-menu{left:8px;right:8px;max-width:none}.mp-bigplay{width:60px;height:60px}}
    .modal-overlay.player-modal-ov{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(3,5,12,.95)}
    .player-modal-ov .modal-head{backdrop-filter:none;-webkit-backdrop-filter:none;background:#111423}
    .player-open .app{visibility:hidden}
    .mp-bigplay,.mp-hint{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    .mp-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:6px}
    .mp.simple .mp-stage{border-radius:16px}
    @media(max-width:560px){.mp.simple .mp-stage{border-radius:13px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>

<body>
<div class="app community-mode">
  <header class="topbar">

  <main id="mainContent" class="wrap"></main>

  <nav class="bottom-nav" aria-label="التنقل الرئيسي">

    <button class="nav-item" data-nav="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4Z" stroke-linejoin="round"/></svg><span>المحفوظات</span></button>
    <button class="nav-item" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7.8 7.8 0 0 0 0-3l2-1.5-2-3.4-2.3.8a7.8 7.8 0 0 0-2.6-1.5L13.8 2h-3.6l-.4 2.9a7.8 7.8 0 0 0-2.6 1.5l-2.3-.8-2 3.4 2 1.5a7.8 7.8 0 0 0 0 3l-2 1.5 2 3.4 2.3-.8a7.8 7.8 0 0 0 2.6 1.5l.4 2.9h3.6l.4-2.9a7.8 7.8 0 0 0 2.6-1.5l2.3.8 2-3.4Z" stroke-linejoin="round" transform="translate(-.5 -.5) scale(.96)"/></svg><span>الإعدادات</span></button>

<div id="toastStack" class="toast-stack" aria-live="polite"></div>
<div id="modalRoot"></div>
<script>
(() => {
  'use strict';
  const CHANNEL_DEFAULTS = [
    {id:'enactus',name:'Enactus Egypt',handle:'Enactus Egypt',searchTerm:'Enactus Egypt',url:'https://www.youtube.com/results?search_query=Enactus+Egypt+official',category:'تنمية ومجتمع',letter:'E',color:'linear-gradient(145deg,#77c9a6,#27876f)'},
    {id:'amgad',name:'الشيخ أمجد سمير',handle:'@amgad_samir',searchTerm:'الشيخ أمجد سمير',url:'https://youtube.com/@amgad_samir',category:'دعوة ووعي',letter:'أ',color:'linear-gradient(145deg,#83a9ff,#555eb9)'},
    {id:'shaarawy',name:'الشيخ محمد متولي الشعراوي',handle:'@alsharawiofficial',searchTerm:'الشيخ محمد متولي الشعراوي',url:'https://youtube.com/@alsharawiofficial',category:'تفسير القرآن',letter:'ش',color:'linear-gradient(145deg,#c6a2e9,#8863b4)'},
    {id:'mustafa',name:'الدكتور مصطفى محمود',handle:'@drmoustafamahmoud',searchTerm:'الدكتور مصطفى محمود',url:'https://youtube.com/@drmoustafamahmoud',category:'فكر ومعرفة',letter:'م',color:'linear-gradient(145deg,#edc78d,#b77b43)'}
  ];  const KEY = {api:'mawja_api_key_v1',channels:'mawja_channels_v1',meta:'mawja_meta_v1',videos:'mawja_videos_v1',saved:'mawja_saved_v1',sync:'mawja_sync_v1',token:'mawja_tokens_v1'};
  const safeRead = (k, fallback) => { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } };
  const safeWrite = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast('مساحة التخزين ممتلئة؛ امسح بعض البيانات من المتصفح.','error'); return false; } };
  const customChannels = safeRead(KEY.channels, {});
  const state = {
    apiKey: localStorage.getItem(KEY.api) || '',
    channels: CHANNEL_DEFAULTS.map(c => ({...c, ...(customChannels[c.id] || {})})),
    meta: safeRead(KEY.meta, {}), videos: safeRead(KEY.videos, {}), saved: safeRead(KEY.saved, []),
    tokens: safeRead(KEY.token, {}), lastSync: Number(localStorage.getItem(KEY.sync) || 0),
    view:'home', activeChannel:null, search:'', filter:'all', loading:false, loadingMore:false, errors:{}, toastTimer:null
  };
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const svg = {
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg>',
    play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.7c0-1 1.1-1.6 2-1l10 6.3a1.2 1.2 0 0 1 0 2L10 19.3c-.9.6-2 0-2-1Z"/></svg>',
    save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4Z" stroke-linejoin="round"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.1 9a6.5 6.5 0 0 1 10.7-2L20 12M4 12l3.2 5a6.5 6.5 0 0 0 10.7-2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg>',
    alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5m0 4h.01" stroke-linecap="round"/></svg>',
    playRect:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 5 3-5 3Z" fill="currentColor" stroke="none"/></svg>'
  };
  const getChannel = id => state.channels.find(c=>c.id===id);
  const getAllVideos = () => Object.values(state.videos).flat().sort((a,b)=>Date.parse(b.publishedAt||0)-Date.parse(a.publishedAt||0));
  const getVideo = id => getAllVideos().find(v=>v.id===id) || state.saved.find(v=>v.id===id);
  const isSaved = id => state.saved.some(v=>v.id===id);
  const shortDate = value => { if(!value) return 'تاريخ غير معروف'; const d=new Date(value); if(Number.isNaN(+d)) return ''; return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short',year: d.getFullYear()!==new Date().getFullYear()?'numeric':undefined}).format(d); };
  const timeAgo = value => { if(!value) return 'على يوتيوب'; const diff=Math.max(0,Date.now()-new Date(value).getTime()); const days=Math.floor(diff/86400000); if(days<1) return 'اليوم'; if(days===1) return 'من يوم'; if(days<7) return `من ${days} أيام`; if(days<30) return `من ${Math.floor(days/7)} أسبوع`; if(days<365) return `من ${Math.floor(days/30)} شهر`; return shortDate(value); };
  const isNew = value => value && Date.now()-new Date(value).getTime() < 7*86400000;
  function toast(message,type='success'){ const host=$('#toastStack'); host.innerHTML=`<div class="toast ${type==='error'?'error':''}">${type==='error'?svg.alert:svg.check}<span>${esc(message)}</span></div>`; clearTimeout(state.toastTimer); state.toastTimer=setTimeout(()=>host.innerHTML='',3800); }
  function persist(){ safeWrite(KEY.meta,state.meta); safeWrite(KEY.videos,state.videos); safeWrite(KEY.saved,state.saved.slice(0,200)); safeWrite(KEY.token,state.tokens); localStorage.setItem(KEY.sync,String(state.lastSync||0)); }
  function channelAvatar(c, sizeClass=''){ const m=state.meta[c.id]; const img=m?.thumbnail; return `<div class="channel-avatar ${sizeClass}" style="background:${c.color}">${esc(c.letter)}${img?`<img loading="lazy" src="${esc(img)}" alt="" onerror="this.remove()">`:''}</div>`; }
  function channelCard(c){ const list=state.videos[c.id]||[]; const latest=list[0]; return `<article class="channel-card" data-channel="${c.id}" tabindex="0" role="button" aria-label="فتح قناة ${esc(c.name)}"><div class="channel-top">${channelAvatar(c)}<div style="min-width:0;flex:1"><div class="channel-name">${esc(state.meta[c.id]?.title||c.name)}</div><div class="channel-handle">${esc(state.meta[c.id]?.handle||c.handle)}</div></div><span class="channel-type">${esc(c.category)}</span></div><div class="channel-footer"><div class="channel-latest"><span class="tiny-dot"></span><span>${latest?`آخر فيديو · ${esc(timeAgo(latest.publishedAt))}`:(state.apiKey?'بانتظار المزامنة':'جاهزة للفتح')}</span></div><a class="channel-official-link" href="${esc(c.url||('https://www.youtube.com/results?search_query='+encodeURIComponent(c.searchTerm||c.name)))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" aria-label="فتح قناة ${esc(c.name)} على يوتيوب">القناة ↗</a></div></article>`; }
  function videoCard(v){ const channel=getChannel(v.channelId); const thumb=v.thumbnail||`https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg`; const saved=isSaved(v.id); return `<article class="video-card"><button class="thumb-button" data-watch="${esc(v.id)}" aria-label="شغّل ${esc(v.title)}"><img loading="lazy" src="${esc(thumb)}" alt="" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/mqdefault.jpg'"><span class="thumb-shade"></span><span class="play-circle">${svg.play}</span>${isNew(v.publishedAt)?'<span class="thumb-label">جديد</span>':''}</button><button class="save-button ${saved?'saved':''}" data-save="${esc(v.id)}" aria-label="${saved?'إزالة من المحفوظات':'حفظ الفيديو'}" title="${saved?'إزالة من المحفوظات':'حفظ الفيديو'}">${saved?svg.check:svg.save}</button><div class="video-info"><div class="video-channel-dot" style="background:${channel?.color||'linear-gradient(145deg,#8d72ff,#62e4d4)'}">${esc(channel?.letter||'▶')}</div><div class="video-meta"><h3 class="video-title">${esc(v.title||'فيديو بدون عنوان')}</h3><div class="video-subline"><span class="video-channel">${esc(v.channelTitle||channel?.name||'YouTube')}</span><span class="meta-sep">·</span><span>${esc(timeAgo(v.publishedAt))}</span></div></div></div></article>`; }
  function emptyState(title, text, button=''){return `<div class="empty-state"><div class="empty-icon">${svg.playRect}</div><strong>${esc(title)}</strong><p>${esc(text)}</p>${button}</div>`;}
  function setupBanner(){ if(state.apiKey) return ''; return `<div class="setup-banner"><div class="setup-icon">${svg.alert}</div><div class="setup-copy"><strong>خطوة واحدة عشان مكتبتك تشتغل</strong><p>أضف مفتاح YouTube Data API مرة واحدة، وهتظهر الفيديوهات القديمة والجديدة من القنوات الستة.</p></div><button class="primary-button" data-nav="settings">إعداد الاتصال</button></div>`; }
  function searchBox(){ return `<div class="search-wrap">${svg.search}<input class="search-input" id="globalSearch" type="search" placeholder="ابحث عن فيديو أو قناة..." value="${esc(state.search)}" aria-label="بحث"></div>`; }
  function renderHome(){ const latest=getAllVideos().slice(0,8); const lastSync=state.lastSync?`آخر تحديث ${shortDate(state.lastSync)}`:'الفيديوهات تتحدّث عند فتح التطبيق'; return `<div class="view-content">
    <section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-mark"></span> مساحة مشاهدة خاصة بيك</div><h1>كل اللي بتتابعه،<br><span>في موجة واحدة.</span></h1><p>مكتبة مرتّبة لقنواتك المفضلة، من غير زحمة اقتراحات. افتح قناتك، اختار الفيديو، واتفرّج من جوه التطبيق.</p><div class="quick-stats"><div class="quick-stat"><span class="mini-symbol">${svg.playRect}</span><span><b>6</b> قنوات مختارة</span></div><div class="quick-stat"><span class="mini-symbol">${svg.refresh}</span><span>${esc(lastSync)}</span></div></div></div><div class="hero-side"><div class="wave-art"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="hero-note">محتواك · في مكان واحد</div></div></section>
    ${setupBanner()}
    <section class="section"><div class="section-head"><div><h2 class="section-title">قنواتك المختارة</h2><div class="section-sub">ست قنوات بس — زي ما طلبت</div></div><button class="text-button" data-nav="channels">عرض كل القنوات ←</button></div><div class="channel-grid">${state.channels.map(channelCard).join('')}</div></section>

          <button class="mp-btn" data-p="back" aria-label="رجوع 10 ثواني" title="رجوع 10 ثواني">${PI.back}<small>10</small></button>
          <button class="mp-btn" data-p="fwd" aria-label="تقديم 10 ثواني" title="تقديم 10 ثواني">${PI.fwd}<small>10</small></button>
          <div class="mp-vol"><button class="mp-btn" id="mpMute" data-p="mute" aria-label="كتم الصوت">${PI.vol}</button><input class="mp-range" id="mpVol" type="range" min="0" max="100" step="1" value="100" dir="ltr" aria-label="مستوى الصوت"></div>
          <span class="mp-spacer"></span>
          <button class="mp-chip" id="mpCcBtn" data-p="menu" data-kind="cc" aria-label="الترجمة">${PI.cc}<span>ترجمة</span></button>
          <button class="mp-chip" id="mpSpeedBtn" data-p="menu" data-kind="speed" aria-label="السرعة"><span>1x</span></button>
          <button class="mp-chip" id="mpQBtn" data-p="menu" data-kind="quality" aria-label="الجودة">${PI.gear}<span>الجودة</span></button>
          <button class="mp-btn" id="mpFs" data-p="fs" aria-label="ملء الشاشة">${PI.fs}</button>
        </div>
      </div>
    </div>
    <p class="player-tip">الجودة والترجمة والسرعة وملء الشاشة كلها من الأزرار اللي تحت الفيديو، وكل حاجة بتفضل جوه موجة. لو يوتيوب ما وفّرش جودة معيّنة للفيديو ده هتشوف أقرب جودة متاحة.</p>`;
  }

  function setPStatus(html,isError){
    const el=$('#mpStatus');if(!el)return;
    if(!html){el.classList.add('hidden');return;}
    el.classList.remove('hidden');el.classList.toggle('error',!!isError);el.innerHTML=html;
  }
  function setHint(text){const h=$('#mpHint');if(!h)return;if(text){h.textContent=text;h.classList.remove('hidden');}else h.classList.add('hidden');}

  function exitNativeFs(){
    try{if(document.fullscreenElement||document.webkitFullscreenElement){const r=(document.exitFullscreen||document.webkitExitFullscreen).call(document);if(r&&r.catch)r.catch(()=>{});}}catch{}
  }
  function destroyPlayer(){
    const p=P;if(!p)return;P=null;
    clearInterval(p.timer);clearTimeout(p.wd);clearTimeout(p.qTimer);clearTimeout(p.tapT);clearTimeout(p.trackT);
    document.removeEventListener('keydown',p.onKey,true);
    document.removeEventListener('fullscreenchange',p.onFs);
    document.removeEventListener('webkitfullscreenchange',p.onFs);
    exitNativeFs();
    try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch{}
    try{p.yt&&p.yt.destroy&&p.yt.destroy();}catch{}
  }

  function setFsClass(on){
    const root=$('#mp');if(!root)return;
    root.classList.toggle('is-fs',on);root.classList.toggle('pseudo-fs',!!(P&&P.pseudoFs));
    const b=$('#mpFs');if(b){b.innerHTML=on?PI.fsExit:PI.fs;b.setAttribute('aria-label',on?'خروج من ملء الشاشة':'ملء الشاشة');}
  }
  function enterFs(){
    const el=$('#mp');if(!el||!P)return;
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    const fallback=()=>{P.pseudoFs=true;setFsClass(true);};
    if(req){
      try{const r=req.call(el);if(r&&r.then){r.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch{}}).catch(fallback);}return;}catch{}
    }
    fallback();
  }
  function exitFs(){
    if(!P)return;
    exitNativeFs();P.pseudoFs=false;setFsClass(false);
    try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch{}
  }
  function toggleFs(){if(!P)return;const on=!!(document.fullscreenElement||document.webkitFullscreenElement)||P.pseudoFs;if(on)exitFs();else enterFs();}
  window.__mawjaExitPlayerFs=()=>{if(P&&P.pseudoFs){exitFs();return true;}return false;};

  function togglePlay(){
    if(!P||!P.ready)return;const yt=P.yt;let st=-1;
    try{st=yt.getPlayerState();}catch{}
    try{if(st===1||st===3){yt.pauseVideo();}else{if(st===0)yt.seekTo(0,true);yt.playVideo();ensurePlayback();}}catch{}
    setTimeout(syncUI,60);
  }
  /* لو المتصفح/الـWebView رفض التشغيل من خارج الـiframe نخلّي الضغطة الجاية توصل للمشغّل نفسه (برضه جوه الموقع) */
  function ensurePlayback(){
    clearTimeout(P.tapT);
    P.tapT=setTimeout(()=>{
      if(!P)return;let st=-1;try{st=P.yt.getPlayerState();}catch{}
      if(st!==1&&st!==3){
        const sh=$('#mpShield');if(sh)sh.style.pointerEvents='none';
        const b=$('#mpBig');if(b)b.classList.add('hidden');
        P.tapThrough=true;setHint('اضغط على الفيديو نفسه مرة واحدة عشان يبدأ');
      }
    },1300);
  }
  function restoreShield(){
    if(!P||!P.tapThrough)return;
    P.tapThrough=false;const sh=$('#mpShield');if(sh)sh.style.pointerEvents='';setHint('');
  }
  function seekBy(d){
    if(!P||!P.ready)return;const yt=P.yt;
    try{const dur=yt.getDuration()||0;let t=yt.getCurrentTime()+d;t=Math.max(0,dur?Math.min(dur-0.3,t):t);yt.seekTo(t,true);}catch{}
    setTimeout(syncUI,60);
  }
  function updateMuteIcon(){
    const b=$('#mpMute');if(!b||!P||!P.ready)return;let m=false;
    try{m=P.yt.isMuted()||P.yt.getVolume()===0;}catch{}
    b.innerHTML=m?PI.mute:PI.vol;b.setAttribute('aria-label',m?'تشغيل الصوت':'كتم الصوت');
  }
  function applyVolume(v){
    if(!P||!P.ready)return;v=Math.max(0,Math.min(100,Math.round(v)));const yt=P.yt;
    try{
      yt.setVolume(v);
      if(v>0){if(yt.isMuted())yt.unMute();playerPrefs.muted=false;playerPrefs.volume=v;}
      else{yt.mute();playerPrefs.muted=true;}
    }catch{}
    const s=$('#mpVol');if(s){s.value=v;s.style.setProperty('--pct',v+'%');}
    updateMuteIcon();savePlayerPrefs();
  }
  function changeVol(d){let cur=playerPrefs.muted?0:playerPrefs.volume;applyVolume(cur+d);}
  function toggleMute(){
    if(!P||!P.ready)return;const yt=P.yt;let m=false;
    try{m=yt.isMuted()||yt.getVolume()===0;}catch{}
    if(m){applyVolume(playerPrefs.volume>0?playerPrefs.volume:100);}
    else{
      try{yt.mute();}catch{}
      playerPrefs.muted=true;const s=$('#mpVol');if(s){s.value=0;s.style.setProperty('--pct','0%');}
      updateMuteIcon();savePlayerPrefs();
    }
  }

  function syncUI(){
    if(!P||!P.ready)return;const yt=P.yt;let st=-1,cur=0,dur=0;
    try{st=yt.getPlayerState();cur=yt.getCurrentTime();dur=yt.getDuration();}catch{return;}
    const playing=st===1||st===3;
    const pb=$('#mpPlay');
    if(pb&&P.lastPlaying!==playing){pb.innerHTML=playing?PI.pause:PI.play;pb.setAttribute('aria-label',playing?'إيقاف مؤقت':'تشغيل');P.lastPlaying=playing;}
    const big=$('#mpBig');
    if(big)big.classList.toggle('hidden',playing||P.tapThrough||!$('#mpStatus').classList.contains('hidden'));
    const seek=$('#mpSeek');
    if(seek&&!P.dragging&&dur>0){const f=Math.min(1,cur/dur);seek.value=Math.round(f*1000);seek.style.setProperty('--pct',(f*100).toFixed(2)+'%');}
    const c=$('#mpCur'),d=$('#mpDur');
    if(c&&!P.dragging)c.textContent=fmtTime(cur);
    if(d)d.textContent=dur>0?fmtTime(dur):'مباشر';
  }

  /* ---------- الجودة ---------- */
  const currentQ=()=>{try{return P.yt.getPlaybackQuality();}catch{return '';}};
  function updateQualityBtn(){const b=$('#mpQBtn span');if(!b||!P)return;b.textContent=QUALITY_SHORT[currentQ()]||'الجودة';}
  function applyQuality(opts={}){
    if(!P||!P.ready)return;const yt=P.yt;let levels=[];
    try{levels=(yt.getAvailableQualityLevels()||[]).filter(q=>QUALITY_ORDER.includes(q));}catch{}
    const pref=playerPrefs.quality;let want=pref;
    if(pref==='best')want=QUALITY_ORDER.find(q=>levels.includes(q))||'hd1080';
    else if(pref!=='auto'&&levels.length&&!levels.includes(pref)){const i=QUALITY_ORDER.indexOf(pref);want=QUALITY_ORDER.slice(i).find(q=>levels.includes(q))||want;}
    try{
      if(want==='auto'){
        if(yt.setPlaybackQualityRange)yt.setPlaybackQualityRange('tiny','highres');
        yt.setPlaybackQuality('default');
      }else{
        yt.setPlaybackQuality(want);
        if(yt.setPlaybackQualityRange)yt.setPlaybackQualityRange(want,want);
        if(opts.user){const t=yt.getCurrentTime();yt.seekTo(t,true);}
      }
    }catch{}
    clearTimeout(P.qTimer);
    P.qTimer=setTimeout(()=>{
      if(!P)return;updateQualityBtn();
      if(!opts.user)return;
      const got=currentQ();
      if(want==='auto')toast('الجودة بقت تلقائية.');
      else if(got&&got!==want)toast(`يوتيوب شغّل الفيديو بجودة ${QUALITY_SHORT[got]||got} بدل ${QUALITY_SHORT[want]||want}. ده أقرب متاح لهذا الفيديو دلوقتي.`,'error');
      else toast('الجودة: '+(QUALITY_SHORT[got||want]||want));
    },2200);
  }

  /* ---------- الترجمة ---------- */
  const trackName=t=>t.displayName||(t.languageName&&(t.languageName.simpleText||t.languageName))||t.name||t.languageCode||'ترجمة';
  function readCc(){try{const t=P.yt.getOption('captions','track');return t&&t.languageCode?t.languageCode:'';}catch{return '';}}
  function updateCcBtn(){
    const b=$('#mpCcBtn');if(!b||!P)return;
    b.classList.toggle('on',!!P.ccCode);
    b.classList.toggle('dim',P.tracksTried>=MAX_TRACK_TRIES&&!P.tracks.length);
  }
  function choosePreferredTrack(list){
    if(!list.length)return null;
    const pl=playerPrefs.captionLang;
    return (pl&&list.find(t=>t.languageCode===pl))||list.find(t=>/^ar/i.test(t.languageCode||'')&&t.kind!=='asr')||list.find(t=>/^ar/i.test(t.languageCode||''))||list.find(t=>t.is_default)||list[0];
  }
  function setCaption(tr,opts={}){
    if(!P||!P.ready)return;const yt=P.yt;
    try{
      if(!tr){
        yt.setOption('captions','track',{});
        try{yt.unloadModule('captions');}catch{}
        P.ccCode='';P.ccIdx=-1;if(!opts.auto)playerPrefs.captions=false;
      }else{
        try{yt.loadModule('captions');}catch{}
        yt.setOption('captions','track',{languageCode:tr.languageCode});
        P.ccCode=tr.languageCode;P.ccIdx=P.tracks.indexOf(tr);
        if(!opts.auto){playerPrefs.captions=true;playerPrefs.captionLang=tr.languageCode;}
      }
    }catch{}
    if(!opts.auto)savePlayerPrefs();
    updateCcBtn();
  }
  function quickCaptions(){
    if(!P||!P.ready)return;
    if(P.ccCode){setCaption(null);toast('اتقفلت الترجمة.');return;}
    const t=choosePreferredTrack(P.tracks);
    if(t){setCaption(t);toast('الترجمة: '+trackName(t));}else toast('مفيش ترجمة متاحة للفيديو ده.','error');
  }
  function scanTracks(){
    if(!P||!P.ready)return;const my=P;my.tracksTried++;
    let list=[];try{list=my.yt.getOption('captions','tracklist')||[];}catch{}
    if(list.length){
      my.tracks=list;
      const cur=readCc();const want=choosePreferredTrack(list);
      if(playerPrefs.captions){
        if(want&&want.languageCode!==cur)setCaption(want,{auto:true});
        else{my.ccCode=cur;my.ccIdx=list.findIndex(t=>t.languageCode===cur);}
      }else{if(cur)setCaption(null,{auto:true});}
      updateCcBtn();return;
    }
    if(my.tracksTried<MAX_TRACK_TRIES){my.trackT=setTimeout(()=>{if(P===my)scanTracks();},1200);}
    updateCcBtn();
  }
  function initCaptions(){
    if(!P)return;
    try{P.yt.loadModule('captions');}catch{try{P.yt.loadModule('cc');}catch{}}
    P.trackT=setTimeout(()=>{if(P)scanTracks();},900);
  }

  /* ---------- القوائم ---------- */
  const mi=(kind,val,label,active,sub='')=>`<button class="mp-item ${active?'active':''}" role="menuitem" data-p="pick" data-kind="${kind}" data-val="${esc(val)}"><span>${esc(label)}${sub?`<em>${esc(sub)}</em>`:''}</span>${active?svg.check:''}</button>`;
  function closeMenu(){const m=$('#mpMenu');if(m){m.classList.add('hidden');m.innerHTML='';}if(P)P.menuOpen='';$$('.mp-chip').forEach(b=>b.setAttribute('aria-expanded','false'));}
  function openMenu(kind){
    const menu=$('#mpMenu');if(!menu||!P||!P.ready)return;
    if(P.menuOpen===kind){closeMenu();return;}
    const yt=P.yt;let html='';
    if(kind==='quality'){
      let levels=[],cur='';
      try{levels=(yt.getAvailableQualityLevels()||[]).filter(q=>QUALITY_ORDER.includes(q));cur=yt.getPlaybackQuality();}catch{}
      levels.sort((a,b)=>QUALITY_ORDER.indexOf(a)-QUALITY_ORDER.indexOf(b));
      html='<div class="mp-menu-title">جودة الفيديو</div>'
        +mi('quality','best','الأعلى المتاح',playerPrefs.quality==='best',levels.length?'حتى '+QUALITY_SHORT[levels[0]]+' · موصى بها':'موصى بها')
        +levels.map(q=>mi('quality',q,QUALITY_NAMES[q],playerPrefs.quality===q,q===cur?'الجودة الحالية':'')).join('')
        +mi('quality','auto','تلقائي',playerPrefs.quality==='auto','حسب سرعة النت');
      if(!levels.length)html+='<div class="mp-menu-note">القائمة هتكتمل أول ما الفيديو يبدأ.</div>';
    }else if(kind==='cc'){
      html='<div class="mp-menu-title">الترجمة</div>'+mi('cc','off','إيقاف الترجمة',!P.ccCode);
      if(P.tracks.length)html+=P.tracks.map((t,i)=>mi('cc',String(i),trackName(t),P.ccIdx===i||(P.ccIdx<0&&P.ccCode&&t.languageCode===P.ccCode))).join('');
      else html+=`<div class="mp-menu-note">${P.tracksTried>=MAX_TRACK_TRIES?'مفيش ترجمة متاحة للفيديو ده.':'جارٍ البحث عن ترجمة...'}</div>`;
    }else if(kind==='speed'){
      let rates=[0.5,0.75,1,1.25,1.5,1.75,2],cur=1;
      try{const r=yt.getAvailablePlaybackRates();if(r&&r.length)rates=r;cur=yt.getPlaybackRate();}catch{}
      html='<div class="mp-menu-title">سرعة التشغيل</div>'+rates.map(r=>mi('speed',String(r),r===1?'عادية':r+'x',r===cur)).join('');
    }
    menu.innerHTML=html;menu.classList.remove('hidden');P.menuOpen=kind;
    $$('.mp-chip').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.kind===kind)));
  }
  function pickItem(kind,val){
    if(!P||!P.ready)return;
    if(kind==='quality'){playerPrefs.quality=val;savePlayerPrefs();applyQuality({user:true});}
    else if(kind==='cc'){if(val==='off'){setCaption(null);}else{const t=P.tracks[Number(val)];if(t)setCaption(t);}}
    else if(kind==='speed'){const r=Number(val);try{P.yt.setPlaybackRate(r);}catch{}playerPrefs.speed=r;savePlayerPrefs();updateSpeedBtn();}
    closeMenu();
  }
  function updateSpeedBtn(){
    const b=$('#mpSpeedBtn span');if(!b||!P)return;let r=playerPrefs.speed;
    try{if(P.ready)r=P.yt.getPlaybackRate()||r;}catch{}
    b.textContent=r+'x';
  }

  function onPlayerClick(e){
    const el=e.target.closest('[data-p]');if(!el||!P)return;
    const a=el.dataset.p;
    if(a==='shield'&&P.menuOpen){closeMenu();return;}
    if(a!=='menu'&&a!=='pick')closeMenu();
    if(a==='toggle'||a==='shield')togglePlay();
    else if(a==='back')seekBy(-10);
    else if(a==='fwd')seekBy(10);
    else if(a==='mute')toggleMute();
    else if(a==='fs')toggleFs();
    else if(a==='menu')openMenu(el.dataset.kind);
    else if(a==='pick')pickItem(el.dataset.kind,el.dataset.val);
    else if(a==='simple')enterSimpleMode();
    else if(a==='retry'){const id=P.id;playVideo(id);}
  }

  function embedUrl(id,simple){
    const base={autoplay:1,rel:0,playsinline:1,iv_load_policy:3,modestbranding:1,hl:'ar',cc_lang_pref:playerPrefs.captionLang||'ar',cc_load_policy:playerPrefs.captions?1:0};
    const q=simple?Object.assign({controls:1,fs:1},base):Object.assign({enablejsapi:1,controls:0,disablekb:1,fs:0},base);
    if(location.protocol.indexOf('http')===0)q.origin=location.origin;
    return 'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?'+new URLSearchParams(q).toString();
  }
  function playerVarsFor(){
    const pv={autoplay:1,rel:0,playsinline:1,iv_load_policy:3,modestbranding:1,hl:'ar',cc_lang_pref:playerPrefs.captionLang||'ar',cc_load_policy:playerPrefs.captions?1:0,controls:0,disablekb:1,fs:0,enablejsapi:1};
    if(isWebOrigin())pv.origin=location.origin;
    return pv;
  }
  function stageFrame(src){
    return `<iframe id="mpFrame" src="${esc(src)}" title="مشغّل الفيديو" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; accelerometer; gyroscope" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  }
  /* وضع مبسّط: مشغّل يوتيوب بأزراره الأصلية (الجودة ⚙️ و CC) لكن برضه جوه موجة */
  function enterSimpleMode(){
    if(!P)return;const my=P;
    clearInterval(my.timer);clearTimeout(my.wd);clearTimeout(my.tapT);clearTimeout(my.trackT);clearTimeout(my.qTimer);
    try{my.yt&&my.yt.destroy&&my.yt.destroy();}catch{}
    my.yt=null;my.ready=false;my.simple=true;
    const stage=$('#mpStage');if(!stage)return;
    stage.innerHTML=stageFrame(embedUrl(my.id,true));
    const ctl=$('#mpControls');if(ctl)ctl.classList.add('hidden');
    const root=$('#mp');if(root)root.classList.add('simple');
    toast('اشتغل الوضع المبسّط: الجودة والترجمة من ⚙️ و CC داخل المشغّل.');
  }
  const isWebOrigin=()=>/^https?:$/.test(location.protocol);
  const ytWatchLink=id=>`<a class="soft-button" href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">افتح على يوتيوب ↗</a>`;
  function slowMessage(title,sub){
    const hint=isWebOrigin()?'':' (التطبيق شغّال من ملف/WebView مش من رابط https، ويوتيوب بيرفض التضمين من الحالة دي — لازم الصفحة تتفتح من استضافة https أو من WebView بقاعدة رابط https.)';
    return `<strong>${esc(title)}</strong><span class="mp-sub">${esc(sub+hint)}</span><div class="mp-actions"><button class="primary-button" data-p="retry">إعادة المحاولة</button><button class="soft-button" data-p="simple">الوضع المبسّط</button>${P?ytWatchLink(P.id):''}</div>`;
  }

  async function initPlayer(v){
    const my=P={id:v.id,yt:null,ready:false,timer:null,dragging:false,tracks:[],tracksTried:0,ccCode:'',ccIdx:-1,menuOpen:'',pseudoFs:false,lastPlaying:null,started:false,tapThrough:false};
    const root=$('#mp');if(!root)return;
    root.addEventListener('click',onPlayerClick);
    const seek=$('#mpSeek'),vol=$('#mpVol');
    seek.addEventListener('input',()=>{
      if(!P||!P.ready)return;P.dragging=true;const f=seek.value/1000;
      seek.style.setProperty('--pct',(f*100)+'%');
      let d=0;try{d=P.yt.getDuration()||0;}catch{}
      $('#mpCur').textContent=fmtTime(f*d);
    });
    seek.addEventListener('change',()=>{
      if(!P||!P.ready)return;
      try{const d=P.yt.getDuration()||0;if(d)P.yt.seekTo(seek.value/1000*d,true);}catch{}
      P.dragging=false;seek.blur();setTimeout(syncUI,80);
    });
    vol.value=playerPrefs.muted?0:playerPrefs.volume;vol.style.setProperty('--pct',vol.value+'%');
    vol.addEventListener('input',()=>applyVolume(Number(vol.value)));
    vol.addEventListener('change',()=>vol.blur());
    $('#mpShield').addEventListener('dblclick',toggleFs);
    my.onKey=e=>{
      if(!P||e.ctrlKey||e.metaKey||e.altKey)return;
      const k=e.key,t=e.target;
      if(k==='Escape'){
        if(P.menuOpen){e.stopPropagation();closeMenu();return;}
        if(P.pseudoFs){e.stopPropagation();exitFs();return;}
        return;
      }
      if(t&&(t.tagName==='INPUT'||t.isContentEditable))return;
      if(t&&t.tagName==='BUTTON'&&(k===' '||k==='Enter'))return;
      let handled=true;
      switch(k){
        case ' ':case 'k':case 'K':togglePlay();break;
        case 'ArrowLeft':seekBy(-5);break;
        case 'ArrowRight':seekBy(5);break;
        case 'j':case 'J':seekBy(-10);break;
        case 'l':case 'L':seekBy(10);break;
        case 'm':case 'M':toggleMute();break;
        case 'f':case 'F':toggleFs();break;
        case 'c':case 'C':quickCaptions();break;
        case 'ArrowUp':changeVol(10);break;
        case 'ArrowDown':changeVol(-10);break;
        default:handled=false;
      }
      if(handled)e.preventDefault();
    };
    document.addEventListener('keydown',my.onKey,true);
    my.onFs=()=>{
      if(!P)return;const fs=!!(document.fullscreenElement||document.webkitFullscreenElement);
      if(!fs&&P.pseudoFs===false){try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch{}}
      setFsClass(fs||P.pseudoFs);
    };
    document.addEventListener('fullscreenchange',my.onFs);
    document.addEventListener('webkitfullscreenchange',my.onFs);
    updateSpeedBtn();

    /* الـiframe بيتحمّل فورًا بالتوازي مع سكربت الـAPI (أسرع من التحميل على مرحلتين) */
    const stage=$('#mpStage');
    if(stage)stage.insertAdjacentHTML('afterbegin','<div id="mpTarget"></div>');
    my.wd=setTimeout(()=>{if(P===my&&!my.ready&&!my.simple)setPStatus(slowMessage('المشغّل اتأخر في التحميل','ممكن النت بطيء أو يوتيوب مش بيرد. جرّب إعادة المحاولة أو الوضع المبسّط.'),true);},isWebOrigin()?9000:5000);

    try{await loadYouTubeApi();}
    catch{if(P===my&&!my.simple)setPStatus(slowMessage('تعذّر تحميل واجهة التحكم','تأكد من الإنترنت. تقدر تشغّل الفيديو بالوضع المبسّط من غير واجهة التحكم الخاصة.'),true);return;}
    if(P!==my||!$('#mpTarget'))return;

    try{
    my.yt=new YT.Player('mpTarget',{
      videoId:v.id,
      host:'https://www.youtube-nocookie.com',
      playerVars:playerVarsFor(),
      events:{
        onReady:ev=>{
          if(P!==my)return;my.ready=true;clearTimeout(my.wd);const yt=ev.target;
          try{yt.setVolume(playerPrefs.volume);if(playerPrefs.muted)yt.mute();else yt.unMute();yt.setPlaybackRate(playerPrefs.speed);}catch{}
          setPStatus('');updateSpeedBtn();updateMuteIcon();
          my.timer=setInterval(syncUI,400);
          try{yt.playVideo();}catch{}
          syncUI();
        },
        onStateChange:ev=>{
          if(P!==my)return;
          if(ev.data===1){
            if(!my.started){
              my.started=true;initCaptions();applyQuality();
              try{my.yt.setPlaybackRate(playerPrefs.speed);}catch{}
              updateSpeedBtn();
            }
            restoreShield();
          }
          syncUI();
        },
        onPlaybackQualityChange:()=>{if(P===my)updateQualityBtn();},
        onPlaybackRateChange:()=>{if(P===my)updateSpeedBtn();},
        onError:ev=>{
          if(P!==my)return;const code=ev.data;
          const link=`<a class="soft-button" href="https://www.youtube.com/watch?v=${encodeURIComponent(my.id)}" target="_blank" rel="noopener">افتح الفيديو على يوتيوب ↗</a>`;
          let msg,withLink=false;
          if(code===101||code===150){msg='صاحب الفيديو منع تشغيله خارج يوتيوب.';withLink=true;}
          else if(code===153){msg='يوتيوب رفض التشغيل لأن الطلب ما وصلوش بعنوان الصفحة المرجعي (خطأ 153). افتح نسخة HTTPS المنشورة من الموقع مباشرة في Chrome، وليس معاينة ملف محلي أو عارض ملفات داخل تطبيق.';withLink=true;}
          else if(code===100)msg='الفيديو ده محذوف أو بقى خاص.';
          else if(code===2)msg='رابط الفيديو غير صالح.';
          else msg='حصلت مشكلة في تشغيل الفيديو (كود '+code+').';
          clearTimeout(my.wd);
          setPStatus(`<strong>${esc(msg)}</strong>${withLink?link+'<span class="mp-sub">الزر ده بيظهر بس لما يوتيوب نفسه يمنع التشغيل جوه الموقع.</span>':''}`,true);
        }
      }
    });
    }catch(err){if(P===my)setPStatus(slowMessage('تعذّر تشغيل المشغّل','حصل خطأ أثناء تجهيز المشغّل. جرّب إعادة المحاولة.'),true);}
  }

  function playVideo(id){
    const v=getVideo(id);
    if(!v){toast('الفيديو غير موجود في المكتبة. حدّث القائمة وحاول مجددًا.','error');return;}
    const c=getChannel(v.channelId);
    destroyPlayer();
    showModal(`<div class="modal-head"><div style="min-width:0"><div class="modal-title">${esc(v.title)}</div><div class="modal-subtitle">${esc(v.channelTitle||c?.name||'YouTube')} · ${esc(shortDate(v.publishedAt))}</div></div><button class="icon-button" data-close-modal aria-label="إغلاق المشغل">${svg.close}</button></div><div class="modal-body player-body">${playerShell()}</div>`,'player-modal');
    initPlayer(v);
  }
  /* تحميل مسبق لواجهة يوتيوب عشان أول فيديو يفتح أسرع */
  setTimeout(()=>{loadYouTubeApi().catch(()=>{});},1200);
  function toggleSaved(id){const v=getVideo(id);if(!v)return;if(isSaved(id)){state.saved=state.saved.filter(x=>x.id!==id);toast('اتشال من المحفوظات.');}else{state.saved.unshift({...v});state.saved=state.saved.slice(0,200);toast('اتحفظ في مكتبتك.');}persist();render();}
  function navigate(view){state.view=view;state.search='';if(view!=='channel')state.activeChannel=null;render();window.scrollTo({top:0,behavior:'smooth'});if(view==='home'&&state.apiKey&&Date.now()-state.lastSync>15*60*1000)refreshAll({quiet:true});}
  function openChannel(id){state.view='channel';state.activeChannel=id;state.search='';render();window.scrollTo({top:0,behavior:'smooth'});const c=getChannel(id);if(c&&state.apiKey&&!(state.videos[id]||[]).length)refreshOne(id);}
  document.addEventListener('click',async e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}const ch=e.target.closest('[data-channel]');if(ch){openChannel(ch.dataset.channel);return;}const watch=e.target.closest('[data-watch]');if(watch){playVideo(watch.dataset.watch);return;}const save=e.target.closest('[data-save]');if(save){toggleSaved(save.dataset.save);return;}if(e.target.closest('[data-refresh]')){await refreshAll();return;}const rc=e.target.closest('[data-refresh-channel]');if(rc){await refreshOne(rc.dataset.refreshChannel);return;}const more=e.target.closest('[data-loadmore]');if(more){await loadMore(more.dataset.loadmore);return;}const searchC=e.target.closest('[data-search-channel]');if(searchC){await searchChannels(searchC.dataset.searchChannel);return;}const ytC=e.target.closest('[data-youtube-channel]');if(ytC){const c=getChannel(ytC.dataset.youtubeChannel),m=state.meta[c.id];const url=m?.channelId?`https://www.youtube.com/channel/${m.channelId}`:`https://www.youtube.com/${c.handle}`;window.location.href=url;return;}if(e.target.closest('[data-close-modal]')){closeModal();return;}const selected=e.target.closest('[data-select-channel]');if(selected){await selectChannel(selected.dataset.selectChannel,selected.dataset.channelId,selected.dataset.channelTitle,selected.dataset.channelThumb,selected.dataset.channelHandle);return;}if(e.target.matches('[data-overlay]'))closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&window.__modalOpen)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-channel]'))openChannel(e.target.dataset.channel);});
  document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){const cursor=e.target.selectionStart;state.search=e.target.value;const start=state.search;render();const next=$('#globalSearch');if(next){next.focus({preventScroll:true});try{next.setSelectionRange(cursor,cursor)}catch{}}}});
  document.addEventListener('submit',async e=>{if(e.target.id==='apiForm'){e.preventDefault();const b=e.target.querySelector('button[type="submit"]');b.disabled=true;const old=b.textContent;b.textContent='جارٍ الاختبار...';await verifyAndSaveKey($('#apiKeyInput')?.value||'');const live=$('#apiForm button[type="submit"]');if(live){live.disabled=false;live.textContent=old;}return;}if(e.target.id==='channelsForm'){e.preventDefault();const data=new FormData(e.target);const edits={};state.channels.forEach(c=>{const val=String(data.get(c.id)||'').trim();if(!val)return;const idMatch=val.match(/youtube\.com\/channel\/(UC[\w-]+)/i);const handleMatch=val.match(/youtube\.com\/@([^?\/#]+)/i)||val.match(/youtube\.com\/@([^?\/#]+)/i);if(idMatch){c.handle=idMatch[1];state.meta[c.id]={channelId:idMatch[1],uploadsPlaylistId:'',title:c.name,handle:c.handle,thumbnail:''};}else{let handle=val;if(handle.includes('youtube.com'))handle=handleMatch?'@'+handleMatch[1]:handle.replace(/^https?:\/\/(www\.)?youtube\.com\//,'').replace(/\/$/,'');if(handle.startsWith('@'))c.handle=handle;else if(!handle.includes('/'))c.handle='@'+handle;else c.handle=handle;delete state.meta[c.id];}edits[c.id]={handle:c.handle};delete state.errors[c.id];});safeWrite(KEY.channels,edits);persist();toast('تم حفظ روابط القنوات.');render();return;}});
  document.addEventListener('click',e=>{if(e.target.id==='clearApiKey'){state.apiKey='';localStorage.removeItem(KEY.api);render();toast('تم مسح مفتاح API.');}});
  window.handleAndroidBack=()=>{if(window.__modalOpen){if(window.__mawjaExitPlayerFs&&window.__mawjaExitPlayerFs())return 'handled';closeModal();return 'handled';}return 'exit';};
  window.addEventListener('online',()=>{if(state.apiKey)refreshAll({quiet:true});});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.apiKey&&Date.now()-state.lastSync>15*60*1000)refreshAll({quiet:true});});
  render();
  if(state.apiKey&&(!state.lastSync||Date.now()-state.lastSync>15*60*1000)){refreshAll({quiet:true});}
  setInterval(()=>{if(state.apiKey&&document.visibilityState==='visible'&&!state.loading&&Date.now()-state.lastSync>15*60*1000)refreshAll({quiet:true});},5*60*1000);
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
<script src="./community.js"></script>
</body>
